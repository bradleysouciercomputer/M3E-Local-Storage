<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6f4fb" />
  <title>Site Offline</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #292536; background: #f6f4fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); text-align: center; padding: 42px 32px; border: 1px solid #e6e1f0; border-radius: 28px; background: #fff; box-shadow: 0 20px 70px rgba(43, 33, 76, .08); }
    .mark { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 22px; border-radius: 19px; background: #eee9ff; color: #6553b8; font-size: 28px; }
    h1 { margin: 0; font-size: clamp(26px, 6vw, 34px); letter-spacing: -.04em; }
    p { margin: 14px 0 0; color: #716b7f; font-size: 15px; line-height: 1.7; }
    .state { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; padding: 8px 12px; border-radius: 999px; background: #f1eff6; color: #655d75; font-size: 12px; font-weight: 650; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #92899f; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">◼</div>
    <h1>This site is offline</h1>
    <p>M3E Local Storage is no longer available here. The project repository and its source files have been preserved.</p>
    <div class="state"><span class="dot"></span> Offline</div>
  </main>
</body>
</html>
